<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function() {
        // Intercept Vite client WebSocket connection logs in sandbox/iFrame environment
        const origError = console.error;
        console.error = function(...args) {
          const first = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].message) || '';
          if (typeof first === 'string' && (first.includes('[vite]') || first.includes('websocket') || first.includes('WebSocket') || first.includes('failed to connect to websocket'))) {
            return;
          }
          return origError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            const msg = (event.reason.message || String(event.reason)).toLowerCase();
            const stack = (event.reason.stack || '').toLowerCase();
            if (msg.includes('websocket') || msg.includes('vite:ws') || msg.includes('ws') || stack.includes('@vite/client')) {
              event.preventDefault();
              event.stopImmediatePropagation?.();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = (event && event.message ? event.message : '').toLowerCase();
          const file = (event && event.filename ? event.filename : '').toLowerCase();
          if (file.includes('@vite/client') || msg.includes('websocket') || msg.includes('vite:ws') || msg.includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
          }
        }, true);
      })();
    </script>
